# PAGE — 미리 빌드한 이미지(GHCR)로 띄운다. 값은 .env 에 (.env.example 참고).
# PAGE 에는 로그인이 없다. 기본은 이 컴퓨터(127.0.0.1)에서만 열린다 — 다른 기기에서 열려면 README '다른 기기에서 열기'.
# 소스에서 빌드하려면: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
name: page
services:
  page:
    image: ghcr.io/sallos725/page:${PAGE_VERSION:-1.0.0}
    container_name: page
    environment:
      PAGE_SOURCES: "main=/sources/main"
      TZ: "${TZ:-Asia/Seoul}"
      PAGE_EXPORT_IMAGE_BUDGET_MB: "${PAGE_EXPORT_IMAGE_BUDGET_MB:-300}"
      PAGE_PDF_URL: "http://page-pdf:8790"
    volumes:
      - ${PAGE_SAVE_DIR:?set PAGE_SAVE_DIR in .env}:/sources/main:ro
      - ${PAGE_DATA_HOST_DIR:?set PAGE_DATA_HOST_DIR in .env}:/data
    ports:
      - "${PAGE_HOST_BIND:-127.0.0.1}:${PAGE_HOST_PORT:-6008}:8787"
    depends_on:
      - page-pdf
    networks:
      - default # 호스트 포트 게시
      - pdf     # page-pdf 로 가는 내부 전용 길
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # PDF 렌더 사이드카. 호스트 포트 없음, internal 네트워크에만 붙어 밖으로 나가는 길이 없다.
  # PDF 가 필요 없으면 이 서비스와 page 의 depends_on·pdf 네트워크·PAGE_PDF_URL, 아래 networks.pdf 를 지운다.
  page-pdf:
    image: ghcr.io/sallos725/page-pdf:${PAGE_VERSION:-1.0.0}
    container_name: page-pdf
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    pids_limit: 512
    init: true
    networks:
      - pdf
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

networks:
  pdf:
    internal: true
