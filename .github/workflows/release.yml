# PAGE 릴리스: vX.Y.Z(-rc.N) 태그를 올리면 테스트 → page·page-pdf 이미지(amd64+arm64)를 GHCR 에 올리고 출처 증명을 붙인다.
# Windows 포터블 zip(PAGE-X.Y.Z-win-x64.zip)도 만들어 태그의 GitHub Release(없으면 초안)에 붙인다.
# 액션은 커밋 SHA 로 고정한다 (주석의 버전). -rc 같은 시험 태그는 latest·X.Y 를 건드리지 않는다.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: server
        working-directory: server
        run: npm ci && npm test && npm run build
      - name: web
        working-directory: web
        run: npm ci && npx vitest run && npm run check && npm run build

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # windows 러너는 core.autocrlf=true 라 LF 고정 파일이 CRLF 로 바뀐다
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: server
        working-directory: server
        run: npm ci && npm test

  # Windows 포터블 zip (스펙 §8). 빌드·스모크·zip 은 읽기 권한으로 하고, 릴리스 업로드는 아래 portable-release 가 한다.
  portable-win:
    needs: [test, test-windows]
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      NODE_VERSION: '24.21.0'
      # https://nodejs.org/dist/v24.21.0/SHASUMS256.txt 의 win-x64/node.exe
      NODE_SHA256: 'ba4e6d110e8c1592a1ecd390f6b05f3da124b13871a5be62b341a07a853c6c32'
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: build
        run: |
          (cd server && npm ci && npm run build && npm prune --omit=dev)
          (cd web && npm ci && npm run build)
      - name: node.exe
        run: |
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/win-x64/node.exe" -o node.exe
          echo "${NODE_SHA256}  node.exe" | sha256sum -c -
      - name: launcher
        run: |
          # 아이콘은 커밋하지 않고 web/public/favicon.svg 에서 만든다 (sharp 는 서버 의존성이라 prune 뒤에도 있다)
          node portable/make-icon.mjs portable/icon.ico
          # 러너의 mingw 를 먼저 (Strawberry Perl 등 다른 gcc 가 잡히지 않게)
          if [ -d /c/mingw64/bin ]; then export PATH="/c/mingw64/bin:$PATH"; fi
          # 못 찾으면 러너에 무엇이 있는지 남기고 실패 (다음 수정에 쓰게)
          command -v gcc || { echo "gcc not found"; ls -d /c/mingw64/bin /c/msys64 /c/ProgramData/mingw64 /c/Strawberry/c/bin 2>&1 || true; echo "$PATH" | tr ':' '\n' | grep -iE 'mingw|msys|straw|gcc' || true; exit 1; }
          gcc --version | sed -n 1p
          WINDRES="$(dirname "$(command -v gcc)")/windres"
          # launcher.rc 의 icon.ico 는 상대 경로라 portable/ 에서 돌린다
          cd portable
          "$WINDRES" launcher.rc -O coff -o launcher.res
          # 한글 L"" 은 UTF-8 소스 그대로. mingw 대체 wprintf 는 _O_U16TEXT 를 안 타서 한글이 깨지므로 끈다
          gcc -municode -O2 -finput-charset=UTF-8 -fexec-charset=UTF-8 -D__USE_MINGW_ANSI_STDIO=0 -o ../PAGE.exe launcher.c launcher.res
          rm -f launcher.res icon.ico
      - name: assemble
        run: node portable/build.mjs --node node.exe --launcher PAGE.exe --out out/PAGE
      - name: smoke
        run: node portable/smoke.mjs out/PAGE
      - name: zip
        run: |
          Z="PAGE-${GITHUB_REF_NAME#v}-win-x64.zip"
          # 맨 위 PAGE\ 폴더 없이 묶는다 — 고른 폴더에 바로 PAGE.exe 가 풀리고, 덮어 풀기 업데이트도 같은 구조
          cd out/PAGE
          7z a -tzip "../$Z" . > /dev/null
          cd ..
          sha256sum "$Z" > "$Z.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-win
          path: |
            out/*.zip
            out/*.zip.sha256
          retention-days: 1
          if-no-files-found: error

  # 쓰기 권한은 이 job 만. 체크아웃 없이 아티팩트만 받아, 태그 릴리스가 없으면 초안으로 만들고(-rc 는 prerelease) zip 을 올린다.
  portable-release:
    needs: portable-win
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-win
          path: out
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft $PRE --title "PAGE ${V}" --notes "릴리스 노트는 게시 전에 채워요."
          gh release upload "$GITHUB_REF_NAME" "out/PAGE-${V}-win-x64.zip" "out/PAGE-${V}-win-x64.zip.sha256" --clobber

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false # 한 이미지가 실패해도 다른 이미지는 끝까지 만든다
      matrix:
        include:
          - name: page
            context: .
          - name: page-pdf
            context: pdf
    env:
      IMAGE: ghcr.io/sallos725/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.licenses=GPL-3.0-only
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # 출처 증명은 개인 계정의 비공개 저장소에서는 쓸 수 없다 (첫 공개 전 비공개 리허설). 공개 저장소에서만 붙인다.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
